name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
      - 'dependabot/**'
    paths-ignore:
      - 'doc/**'
      - 'docker/**'
      - '.run/**'
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: maven

    - name: Set up Maven Cache
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-
        #${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-${{ runner.os }}-

    - name: Build with Maven
      run: ./mvnw --batch-mode clean verify
